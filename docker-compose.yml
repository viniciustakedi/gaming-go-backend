name: jungle-gaming-wallet

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
    # Bound to loopback only: wallet_app has no password until
    # postgres-provisioning sets one below, and the owner's own password is
    # a throwaway local value (.env.example) never meant to be reachable
    # from outside this machine.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallet} -d ${POSTGRES_DB:-wallet}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # AUTH=true turns on MiniStack's IAM enforcement. No AWS_ACCESS_KEY_ID is
  # set here on purpose: setting it would make that key MiniStack's root
  # key, which bypasses every IAM policy - see alignment.md.
  ministack:
    image: ministackorg/ministack:1.5.12
    environment:
      AUTH: "true"
    ports:
      - "${MINISTACK_PORT:-4566}:4566"

  # Realm import happens automatically on boot via --import-realm - no
  # provisioning one-shot needed, unlike ministack/postgres above, and no
  # admin bootstrap either: neither KC_BOOTSTRAP_ADMIN_* nor the legacy
  # KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD are set, so this Keycloak boots
  # with no master-realm admin account at all (security review: a reachable
  # Admin Console with the well-known admin/admin credential could mint a
  # wallet-admin token for anyone who reaches this port). Nothing in this
  # repository needs it: every client, role, mapper and claim the wallet
  # realm needs is declared statically in realm-wallet.json and created by
  # --import-realm itself - the app and every test authenticate exclusively
  # via client_credentials against clients that file already defines,
  # including provider-a-short-lived's 2-second token lifespan (a static
  # `attributes.access.token.lifespan`, not an Admin API call). Bound to
  # 127.0.0.1 for the same reason Postgres is above: this is a realm
  # imported fresh on every `docker compose up`, never a shared or
  # long-lived Keycloak instance, but a reachable Admin Console would still
  # let an attacker on the host revoke roles or rotate client secrets. See
  # "Autenticação e autorização" in README.md for KC_HOSTNAME/
  # KC_HOSTNAME_BACKCHANNEL_DYNAMIC below, which make the token's own "iss"
  # identical for every caller regardless of which of these two addresses
  # reached Keycloak.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      # KC_HOSTNAME fixes the issuer/frontend URL to the address a host
      # process (curl, test/integration) uses; KC_HOSTNAME_BACKCHANNEL_DYNAMIC
      # lets the token/JWKS endpoints Keycloak advertises still resolve
      # dynamically per the Host header a caller used, so the app container
      # (internal Compose network) keeps reaching them at
      # http://keycloak:8080/... while every caller's token still carries
      # the exact same "iss" (ticket 07 review: "o iss do token reflete o
      # host usado para buscá-lo").
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./deploy/keycloak/realm-wallet.json:/opt/keycloak/data/import/realm-wallet.json:ro

  # One-shot: blocks until Keycloak's OIDC discovery endpoint answers 200.
  # Unlike postgres/ministack above, keycloak has no Compose healthcheck -
  # the quay.io image ships neither curl nor wget, so it cannot run a
  # CMD-SHELL probe the way pg_isready does - so
  # scripts/wait-for-integration.sh runs this instead, to know the realm
  # import has actually finished before test/integration starts fetching
  # client_credentials tokens.
  keycloak-wait:
    image: curlimages/curl:8.11.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $(seq 1 60); do
          curl -sf http://keycloak:8080/realms/wallet/.well-known/openid-configuration > /dev/null && exit 0
          sleep 1
        done
        echo "keycloak did not become ready in time" >&2
        exit 1
    depends_on:
      - keycloak

  # One-shot: creates the queues, the DLQ redrive, the four least-privilege
  # IAM users (gateway, consumer, publisher, events-reader) and the IAM test
  # fixtures (deny-probe, redrive-tester, dlq-reader, consumer-fixture - see
  # provision.sh), then writes
  # two credential files under deploy/ministack/.runtime - bind-mounted, not
  # a named volume, so `go test -tags integration ./...` run straight from
  # the host can read the test one. It is the only service in this whole
  # file, and the only place in the repository, that ever holds MiniStack's
  # root credentials. The image is pinned by tag and digest so the same
  # checkout cannot silently start running a different provisioner.
  provisioning:
    image: amazon/aws-cli:2.31.13@sha256:e14216fb361cce909ce199616711ad103182d5937f851cda9bebf25867d7180a
    entrypoint: ["/bin/sh", "/provision.sh"]
    environment:
      AWS_DEFAULT_REGION: ${SQS_REGION:-us-east-1}
      MINISTACK_ENDPOINT_URL: http://ministack:4566
      SQS_INPUT_QUEUE_NAME: ${SQS_INPUT_QUEUE_NAME:-wager-transactions.fifo}
      SQS_DLQ_QUEUE_NAME: ${SQS_DLQ_QUEUE_NAME:-wager-transactions-dlq.fifo}
      SQS_OUTPUT_QUEUE_NAME: ${SQS_OUTPUT_QUEUE_NAME:-wallet-events.fifo}
      WAGER_TRANSACTIONS_MAX_RECEIVE_COUNT: ${WAGER_TRANSACTIONS_MAX_RECEIVE_COUNT:-5}
      IAM_RUNTIME_DIR: /shared
      APP_CREDENTIALS_FILE: /shared/app-credentials.env
      TEST_CREDENTIALS_FILE: /shared/test-credentials.env
      APP_RUNTIME_UID: "10001"
      APP_RUNTIME_GID: "10001"
    volumes:
      - ./deploy/ministack/provision.sh:/provision.sh:ro
      - ./deploy/ministack/.runtime:/shared
    depends_on:
      - ministack

  # One-shot: creates the wallet_app role (LOGIN, no password yet) if it
  # does not already exist, then sets its password. Runs as the postgres
  # image (already has psql) against the owner's own DATABASE_URL, before
  # migrate - the role is a cluster object, so it has to exist before
  # migrations/0002_app_role.up.sql can grant it anything. Idempotent, the
  # same way deploy/ministack/provision.sh is: a random password is
  # generated only the first time and then reused - reapplying the same
  # ALTER ROLE on every subsequent `docker compose up` - so a second
  # `up --build` never rotates it, and neither does a `migrate down`
  # followed by `migrate up`, since neither migration direction touches the
  # role. The credentials file it writes is read straight from the host by
  # test/integration, and mounted read-only into the app container below -
  # never into any other one.
  postgres-provisioning:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/provision.sh"]
    environment:
      OWNER_DATABASE_URL: postgres://${POSTGRES_USER:-wallet}:${POSTGRES_PASSWORD:-wallet}@postgres:5432/${POSTGRES_DB:-wallet}?sslmode=disable
      POSTGRES_RUNTIME_DIR: /shared
      POSTGRES_CREDENTIALS_FILE: /shared/credentials.env
      APP_RUNTIME_UID: "10001"
      APP_RUNTIME_GID: "10001"
    volumes:
      - ./deploy/postgres/provision.sh:/provision.sh:ro
      - ./deploy/postgres/.runtime:/shared
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: *app-image
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wallet}:${POSTGRES_PASSWORD:-wallet}@postgres:5432/${POSTGRES_DB:-wallet}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      postgres-provisioning:
        condition: service_completed_successfully

  app:
    <<: *app-image
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # No owner credential reaches this container at all - only host, port,
      # database and sslmode, none of them a secret. internal/config.Load
      # assembles these into a DSN with no userinfo, and pg.New
      # (internal/pg.AppDSN) adds wallet_app's own least-privilege
      # credentials on top of it, reading the password from
      # DATABASE_APP_CREDENTIALS_FILE below (spec: "a aplicação usa outro
      # [papel], com apenas os grants necessários" - see README.md,
      # "Credenciais do Postgres"). `docker compose exec app env` never
      # shows the migration owner's password.
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB:-wallet}
      DATABASE_SSLMODE: disable
      DATABASE_APP_CREDENTIALS_FILE: /shared/postgres-credentials.env
      SQS_ENDPOINT_URL: http://ministack:4566
      SQS_REGION: ${SQS_REGION:-us-east-1}
      SQS_INPUT_QUEUE_NAME: ${SQS_INPUT_QUEUE_NAME:-wager-transactions.fifo}
      SQS_DLQ_QUEUE_NAME: ${SQS_DLQ_QUEUE_NAME:-wager-transactions-dlq.fifo}
      SQS_OUTPUT_QUEUE_NAME: ${SQS_OUTPUT_QUEUE_NAME:-wallet-events.fifo}
      IAM_CREDENTIALS_FILE: /shared/app-credentials.env
      # Keycloak's own boot (including the realm import above) routinely
      # takes longer than Postgres or MiniStack, and depends_on below can
      # only wait for the container to start, not for Keycloak to actually
      # be ready - AUTH_DISCOVERY_TIMEOUT's generous default (see
      # internal/config) is what makes internal/auth's own retry loop
      # absorb the rest of that wait (ticket 07: "Descoberta OIDC no start
      # hook, com retry limitado ao prazo de start").
      #
      # AUTH_ISSUER_URL is the public address (keycloak's KC_HOSTNAME above)
      # every token's own "iss" claim carries, regardless of who requested
      # it - this is what internal/auth validates a token against, and it
      # must be the exact address a host-side caller (curl, the README's own
      # flow) uses too. AUTH_DISCOVERY_URL is only where this container
      # fetches Keycloak's OIDC configuration and JWKS from - the app can
      # never reach AUTH_ISSUER_URL's host-facing address from inside the
      # Compose network, only keycloak:8080 - and is never compared against
      # a token's "iss" (internal/auth.discoverWithRetry; ticket 07: "separe
      # issuer esperado de URL de descoberta e JWKS").
      AUTH_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8081}/realms/wallet
      AUTH_DISCOVERY_URL: http://keycloak:8080/realms/wallet
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-wallet-api}
      # SQS_CONSUMER_ACCESS_KEY_ID, SQS_CONSUMER_SECRET_ACCESS_KEY,
      # SQS_PUBLISHER_ACCESS_KEY_ID and SQS_PUBLISHER_SECRET_ACCESS_KEY are
      # deliberately not set here: deploy/docker/entrypoint.sh sources them
      # from the file provisioning wrote, since they only exist after that
      # container has run.
    volumes:
      # Only the app's own files are mounted - never a whole .runtime
      # directory - so this container has no path to gateway, events-reader,
      # IAM test fixture keys or the Postgres owner's own credentials, only
      # its own SQS consumer/publisher pair and wallet_app's password. Both
      # provisioning scripts chown their file to the same UID/GID the
      # Dockerfile's non-root "app" user runs as, so each stays readable
      # despite mode 0600.
      - ./deploy/ministack/.runtime/app-credentials.env:/shared/app-credentials.env:ro
      - ./deploy/postgres/.runtime/credentials.env:/shared/postgres-credentials.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-provisioning:
        condition: service_completed_successfully
      provisioning:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
